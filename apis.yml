aid: nstream
name: Nstream
description: >-
  Nstream is the company behind SwimOS, an open-source platform for building
  streaming data applications. Instead of polling databases, Nstream keeps
  application state continuously in memory as stateful "web agents" that
  ingest events from any source, compute in real time, and stream incremental
  updates to API clients and live user interfaces. The stack spans a JVM
  runtime (SwimOS for Java), TypeScript/JavaScript UI toolkits, a Rust runtime
  (swim-rust), and standalone WARP streaming clients, plus the commercial
  Nstream Platform and Nstream Jet low-code tooling for building real-time
  applications used in asset monitoring, fraud detection, customer 360, and
  business visibility across retail, financial services, telecommunications,
  and transportation & logistics.
